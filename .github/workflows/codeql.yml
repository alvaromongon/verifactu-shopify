name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # Skipped job (not workflow) on unrelated changes, so the required "Analyze C#" check still reports.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      csharp: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.codeql == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/path-filters.yml

  analyze:
    name: Analyze C#
    needs: changes
    if: needs.changes.outputs.csharp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-and-quality

      - name: Build
        run: dotnet build --configuration Release

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
          output: sarif-results
          upload: failure-only

      # Code emitted by source generators under obj/ (OpenAPI, System.Text.Json, the xUnit entry
      # point) is compiled, so CodeQL analyzes it; paths-ignore does not apply to a manual C# build.
      - name: Exclude generated code
        uses: advanced-security/filter-sarif@v1.1
        with:
          patterns: |
            -**/obj/**
          input: sarif-results/csharp.sarif
          output: sarif-results/csharp.sarif

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif-results/csharp.sarif
          category: /language:csharp
