name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # VeriFactu crea su carpeta de datos al iniciarse. En Linux es /usr/share/VeriFactu, donde el
      # usuario del runner no puede escribir (mdiago/VeriFactu#273). En macOS y Windows está dentro
      # del perfil del usuario y la crea la propia librería.
      - if: runner.os == 'Linux'
        run: sudo install -d -o "$USER" /usr/share/VeriFactu
      - run: dotnet test
