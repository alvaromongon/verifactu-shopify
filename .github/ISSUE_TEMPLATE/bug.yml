name: Error
description: Algo no funciona como debería.
labels: [bug, needs-triage]
body:
  - type: textarea
    id: what-happens
    attributes:
      label: Qué ocurre
      description: El comportamiento observado, con el mensaje de error si lo hay.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Versión y entorno
      placeholder: p. ej. commit abc1234, CronJob en Kubernetes, preproducción de la AEAT
